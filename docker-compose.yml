services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-extractor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extractor}
      POSTGRES_DB: ${POSTGRES_DB:-extractor}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      # Hostname `db` (not `postgres`) — avoids colliding with kalke-auth's postgres on network kalke-auth.
      DATABASE_URL: postgres://${POSTGRES_USER:-extractor}:${POSTGRES_PASSWORD:-extractor}@db:5432/${POSTGRES_DB:-extractor}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-24h}
      # Public iss in JWTs (clients use localhost:8443 via Caddy on the host).
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8443/realms/kalke}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-personal-document-extractor}
      # Reachable discovery from this container (kalke-auth Caddy on shared network).
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://caddy:8443/realms/kalke}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s
    networks:
      - default
      - kalke-auth

volumes:
  pgdata:

networks:
  kalke-auth:
    external: true
    name: kalke-auth
