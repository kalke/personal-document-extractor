name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: ./...
      - name: Go fmt check
        run: test -z "$(gofmt -l .)"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: extractor
          POSTGRES_PASSWORD: extractor
          POSTGRES_DB: extractor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extractor -d extractor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://extractor:extractor@localhost:5432/extractor?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Migrate
        run: go run ./cmd/migrate
      - name: Test
        run: make test
      - name: Build binaries
        run: |
          go build -o /tmp/api ./cmd/api
          go build -o /tmp/migrate ./cmd/migrate

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        uses: securego/gosec@master
        with:
          args: -severity high ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy fs (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/kalke/personal-document-extractor"
          TAG="${GITHUB_SHA}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    # Same EC2 as kalke-auth. Deploy pulls GHCR image on the self-hosted runner.
    runs-on: [self-hosted, linux, pde-ec2]
    needs: [lint, test, security, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Ensure repo checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /home/ubuntu/personal-document-extractor
        run: |
          set -euo pipefail
          if [[ -d "${REPO_DIR}/.git" ]]; then
            cd "${REPO_DIR}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/kalke/personal-document-extractor.git"
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
            git remote set-url origin "https://github.com/kalke/personal-document-extractor.git"
          else
            tmp=""
            if [[ -f "${REPO_DIR}/prod.env" ]]; then
              tmp="$(mktemp)"
              cp "${REPO_DIR}/prod.env" "${tmp}"
            fi
            rm -rf "${REPO_DIR}"
            git clone "https://x-access-token:${GH_TOKEN}@github.com/kalke/personal-document-extractor.git" "${REPO_DIR}"
            git -C "${REPO_DIR}" remote set-url origin "https://github.com/kalke/personal-document-extractor.git"
            if [[ -n "${tmp}" ]]; then
              cp "${tmp}" "${REPO_DIR}/prod.env"
              rm -f "${tmp}"
            fi
          fi

      - name: Sync prod.env from GitHub secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_ADDR: ${{ secrets.REDIS_ADDR }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          INTROSPECT_SECRET: ${{ secrets.INTROSPECT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          M2M_USER_FORWARD_SECRET: ${{ secrets.M2M_USER_FORWARD_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path.home() / "personal-document-extractor" / "prod.env"
          def q(v: str) -> str:
              return "'" + v.replace("'", "'\"'\"'") + "'"
          required = ("DATABASE_URL", "REDIS_ADDR", "INTROSPECT_SECRET", "GROQ_API_KEY", "M2M_USER_FORWARD_SECRET")
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit(f"missing secrets: {', '.join(missing)}")
          rows = {
              "PORT": "8080",
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "DB_SEARCH_PATH": "pde",
              "REDIS_ADDR": os.environ["REDIS_ADDR"],
              "REDIS_PASSWORD": os.environ.get("REDIS_PASSWORD", ""),
              "REDIS_TLS": "true",
              "REDIS_DB": "0",
              "OIDC_ISSUER": os.environ.get("OIDC_ISSUER") or "https://auth.kalke.dev/realms/kalke",
              "OIDC_AUDIENCE": "personal-document-extractor",
              "AUTH_INTROSPECT_URL": "https://auth.kalke.dev/v1/introspect",
              "INTROSPECT_SECRET": os.environ["INTROSPECT_SECRET"],
              "ADMIN_EMAILS": "henriquekalke@icloud.com",
              "CORS_ORIGINS": "https://kalke.dev,https://www.kalke.dev",
              "GROQ_API_KEY": os.environ["GROQ_API_KEY"],
              "M2M_USER_FORWARD_SECRET": os.environ["M2M_USER_FORWARD_SECRET"],
              "LOG_LEVEL": "info",
              "LOG_FORMAT": "json",
              "RATE_LIMIT_PER_MINUTE": "60",
              "TRUSTED_PROXIES": "172.16.0.0/12,10.0.0.0/8",
          }
          path.write_text("".join(f"{k}={q(v)}\n" for k, v in rows.items()))
          print(f"wrote {path}")
          PY

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image and restart
        working-directory: /home/ubuntu/personal-document-extractor
        env:
          PDE_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          export PDE_IMAGE
          make aws-up
          make aws-ps
