name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: ./...

      - name: Test
        run: make test

      - name: Build
        run: |
          go build -o /tmp/api ./cmd/api
          go build -o /tmp/migrate ./cmd/migrate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t personal-document-extractor:ci .
