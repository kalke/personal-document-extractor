name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: extractor
          POSTGRES_PASSWORD: extractor
          POSTGRES_DB: extractor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extractor -d extractor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://extractor:extractor@localhost:5432/extractor?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: ./...

      - name: Migrate
        run: go run ./cmd/migrate

      - name: Test
        run: make test

      - name: Build
        run: |
          go build -o /tmp/api ./cmd/api
          go build -o /tmp/migrate ./cmd/migrate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t personal-document-extractor:ci .
