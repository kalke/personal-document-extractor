name: dns-pde
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert pde A record (DNS only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONE=$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=kalke.dev" \
            | python3 -c 'import sys,json; r=json.load(sys.stdin); assert r.get("success"), r; print(r["result"][0]["id"])')
          echo "zone=$ZONE"
          EXISTING=$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records?type=A&name=pde.kalke.dev")
          echo "$EXISTING" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("list_success", d.get("success"), d.get("errors")); print("existing", [(x["id"], x["content"], x.get("proxied")) for x in d.get("result") or []])'
          ID=$(echo "$EXISTING" | python3 -c 'import sys,json; r=json.load(sys.stdin).get("result") or []; print(r[0]["id"] if r else "")')
          BODY='{"type":"A","name":"pde","content":"54.234.95.66","ttl":1,"proxied":false}'
          if [[ -n "$ID" ]]; then
            RESP=$(curl -sS -X PUT -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data "$BODY" "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records/${ID}")
          else
            RESP=$(curl -sS -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
              --data "$BODY" "https://api.cloudflare.com/client/v4/zones/${ZONE}/dns_records")
          fi
          echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), d.get("errors"), (d.get("result") or {}).get("name"), (d.get("result") or {}).get("content"), (d.get("result") or {}).get("proxied")); raise SystemExit(0 if d.get("success") else 1)'
