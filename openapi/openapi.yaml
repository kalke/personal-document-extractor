openapi: 3.1.0
info:
  title: Personal Document Extractor API
  version: 1.1.0
  description: |
    Extract structured JSON from Brazilian identity documents, address proofs,
    and invoices.

    **AuthN:** `Authorization: Bearer` with an OIDC access token (RS256) from
    an external IdP (e.g. kalke-auth / Keycloak). Humans use password/PKCE;
    machines use client_credentials. This API is a pure resource server: no
    local `users` table — audit via JWT `sub` (`auth_subject`), OAuth client
    id `azp` (`auth_client`), and `email` when present (`auth_email`).

    **AuthZ scopes:** `extract:write`, `admin` (implies all).
    JWT tokens without IdP `permissions` receive default `extract:write`.

    **Errors:** unless noted, error bodies are `{"error":"<message>"}`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080
    description: Local / Compose
tags:
  - name: health
  - name: extract
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      tags: [health]
      summary: Readiness probe (Postgres required; Redis reported)
      security: []
      operationId: getReady
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              examples:
                ready:
                  value: { status: ready, db: true, redis: true }
        "503":
          description: Postgres unavailable (`status=not_ready`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              examples:
                not_ready:
                  value: { status: not_ready, db: false, redis: true }

  /v1/extract:
    post:
      tags: [extract]
      summary: Extract structured fields from an uploaded document
      description: |
        Requires `extract:write` or `admin`. Rate-limited per principal (Redis;
        fail-closed → 429 if Redis unavailable). Successful responses include
        `X-RateLimit-*` headers. Persist/cache failures after a successful
        extraction still return 200.
      operationId: extractDocument
      parameters:
        - name: doc_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DocType"
        - name: refresh
          in: query
          required: false
          description: Bypass Redis cache and soft-delete prior Postgres row for the same content hash
          schema:
            type: string
            enum: ["true", "1", "yes", "y", "on"]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, JPEG, PNG, or WebP (max 32 MiB)
      responses:
        "200":
          description: Extraction succeeded (`doc_type` + `data` only; no meta)
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
        "400":
          description: Validation / preprocess / unknown doc_type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                missing_doc_type:
                  value: { error: missing doc_type query param }
                missing_file:
                  value: { error: "multipart field 'file' is required" }
                empty_upload:
                  value: { error: uploaded file is empty }
                invalid_multipart:
                  value: { error: invalid multipart form }
                unsupported_media:
                  value: { error: unsupported media type }
                mime_mismatch:
                  value: { error: filename extension does not match file contents }
                invalid_document:
                  value: { error: invalid document }
                unknown_doc_type:
                  value: { error: unknown doc_type }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Upload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                too_large:
                  value: { error: uploaded file exceeds size limit }
        "422":
          description: Model returned unparseable JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                bad_json:
                  value: { error: could not process document }
        "429":
          description: Rate limit exceeded or rate-limit store unavailable
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                exceeded:
                  value: { error: rate limit exceeded }
                unavailable:
                  value: { error: rate limit unavailable }
        "500":
          description: Unexpected extraction failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                unexpected:
                  value: { error: could not process document }
        "502":
          description: Upstream LLM provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                provider:
                  value: { error: extraction provider unavailable }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "OIDC JWT"
      description: |
        Pass an OIDC access token from the configured IdP.
        Middleware errors when missing/invalid:
        - `missing or invalid authorization`
        - `unauthorized`

  parameters:

    X-RateLimit-Limit:
      description: Requests allowed per fixed 1-minute window
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Remaining requests in the current window
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying (on 429 exceeded)
      schema:
        type: integer

  schemas:
    Scope:
      type: string
      enum: [extract:write, admin]

    DocType:
      type: string
      enum: [identity_document, address_proof, invoice_nf]

    ErrorBody:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Stable client-facing message (see examples on each response)
      examples:
        - { error: unauthorized }
        - { error: forbidden }

    ErrorCatalog:
      description: |
        Catalog of `error` string values returned by the API (for documentation).
        Not used as a response schema itself.
      type: string
      enum:
        - authentication not configured
        - missing or invalid authorization
        - unauthorized
        - forbidden
        - rate limit unavailable
        - rate limit exceeded
        - missing doc_type query param
        - multipart field 'file' is required
        - uploaded file is empty
        - invalid multipart form
        - uploaded file exceeds size limit
        - unsupported media type
        - filename extension does not match file contents
        - invalid document
        - unknown doc_type
        - could not process document
        - extraction provider unavailable
        - invalid json body
        - unknown scope

    HealthResponse:
      type: object
      required: [status, doc_types]
      additionalProperties: false
      properties:
        status:
          type: string
          example: ok
        doc_types:
          type: array
          items:
            type: string

    ReadyResponse:
      type: object
      required: [status, db, redis]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        db:
          type: boolean
        redis:
          type: boolean

    ExtractResponse:
      type: object
      required: [doc_type, data]
      additionalProperties: false
      properties:
        doc_type:
          $ref: "#/components/schemas/DocType"
        data:
          description: Document-type-specific fields (identity / address / invoice)
          type: object
          additionalProperties: true
      examples:
        - doc_type: identity_document
          data:
            tipo: CNH
            nome: FULANO DA SILVA
            cpf: "52998224725"
            numero_documento: "12345678901"
            data_nascimento: "1990-01-15"
            orgao_emissor: DETRAN/SP
            validade: "2030-12-31"

  responses:
    Unauthorized:
      description: |
        Missing or invalid Bearer token.
        Typical `error` values: `missing or invalid authorization`, `unauthorized`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            missing_header:
              value: { error: missing or invalid authorization }
            unauthorized:
              value: { error: unauthorized }
    Forbidden:
      description: Authenticated but missing required scope (`error=forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          examples:
            forbidden:
              value: { error: forbidden }
    Error:
      description: Generic error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
