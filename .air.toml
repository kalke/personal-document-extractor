root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/main ./cmd/api"
entrypoint = ["./tmp/main"]
include_ext = ["go", "env"]
exclude_dir = ["tmp", "vendor", "bin", ".git"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
poll = true
poll_interval = 500

[log]
time = false
main_only = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
